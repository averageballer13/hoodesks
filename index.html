<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HOODESKS</title>
<meta name="description" content="Every desk runs its own book, held on chain in a vault only it can own. Mint one, it accumulates round after round, and the whole book transfers when it sells.">
<meta property="og:title" content="HOODESKS">
<meta property="og:description" content="Every desk runs its own book, held on chain in a vault only it can own.">
<meta property="og:url" content="https://hoodesks.fun/">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="HOODESKS">
<meta name="twitter:description" content="Every desk runs its own book, held on chain in a vault only it can own.">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/app.css">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('hoodesks-theme')||'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script>
</head>
<body>
<div class="shell">
  <header id="hdr" class="hdr"></header>
  <div id="tape" class="tape"></div>

  <main class="stack">

    <section class="hero" style="padding:26px 0 4px">
      <h1>A desk that trades<br>while you hold it. <em>On chain.</em></h1>
      <p id="hero-lede"></p>
      <div class="hero__cta">
        <a class="btn btn--primary" href="mint.html">Mint a desk</a>
        <a class="btn btn--ghost" href="docs.html">How it works</a>
      </div>
    </section>

    <section class="frame">
      <div class="frame__in">
        <div class="frame__head">
          <h2 class="frame__title"><span>The desks</span><span class="cursor" aria-hidden="true"></span></h2>
          <div class="tnum" style="font-size:10.5px;color:var(--muted)">
            <b id="minted-count" style="color:var(--ink)">——</b> / <span id="supply-count">5,000</span>
          </div>
        </div>
        <div id="desk-preview" class="deskgrid"></div>
        <p class="frame__cap">
          Eight of five thousand. Each one is a different terminal, fixed at generation
          and reproducible from the seed alone.
          <a href="collection.html" style="color:var(--brand)">See the collection →</a>
        </p>
      </div>
    </section>

    <section class="frame">
      <div class="frame__in frame__in--flush">
        <div class="statsbar" id="stats"></div>
      </div>
    </section>

    <section class="frame">
      <div class="frame__in frame__in--flush">
        <div class="tabs" role="tablist" id="tabs"></div>
        <div id="rows"></div>
        <div id="pager"></div>
      </div>
    </section>

  </main>

  <footer id="ftr"></footer>
</div>
<script type="module" src="assets/js/pages/home.js"></script>
</body>
</html>
